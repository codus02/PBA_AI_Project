<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen Slots Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; min-height: 100vh; }
  .chat-container { width: 600px; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.12); display: flex; flex-direction: column; height: 90vh; }
  .header { background: #4f46e5; color: #fff; padding: 16px 20px; border-radius: 16px 16px 0 0; font-size: 16px; font-weight: 600; }
  .header span { font-size: 12px; opacity: 0.7; display: block; margin-top: 2px; }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .bubble { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.6; word-break: break-word; }
  .bubble.ai   { background: #ede9fe; color: #1e1b4b; align-self: flex-start; border-bottom-left-radius: 4px; }
  .bubble.user { background: #4f46e5; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .debug { align-self: flex-start; font-size: 11px; color: #9ca3af; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 6px 10px; white-space: pre-wrap; font-family: monospace; max-width: 100%; }
  .slots-box { align-self: stretch; font-size: 12px; color: #374151; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 10px 14px; white-space: pre-wrap; font-family: monospace; }
  .input-area { display: flex; padding: 12px; gap: 8px; border-top: 1px solid #e5e7eb; }
  .input-area input { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 24px; font-size: 14px; outline: none; }
  .input-area input:focus { border-color: #4f46e5; }
  .btn { padding: 10px 20px; border: none; border-radius: 24px; font-size: 13px; font-weight: 600; cursor: pointer; background: #4f46e5; color: #fff; }
  .btn:hover { background: #4338ca; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<div class="chat-container">
  <div class="header">
    gemma Slots Chat
    <span>취향 수집 에이전트 테스트</span>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <input type="text" id="input" placeholder="메시지 입력..." />
    <button class="btn" id="btnSend" onclick="sendMessage()">전송</button>
  </div>
</div>

<script>
const messagesEl = document.getElementById("messages");
const inputEl    = document.getElementById("input");
const btnSend    = document.getElementById("btnSend");

function addBubble(text, type) {
  const div = document.createElement("div");
  div.className = `bubble ${type}`;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addDebug(text) {
  const div = document.createElement("div");
  div.className = "debug";
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addSlots(text, completion) {
  const div = document.createElement("div");
  div.className = "slots-box";
  div.textContent = `=== 최종 슬롯 (completion: ${completion}%) ===\n${text}`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setDisabled(v) {
  inputEl.disabled = v;
  btnSend.disabled = v;
}

async function start() {
  setDisabled(true);
  const res = await fetch("/api/start", { method: "POST" });
  const data = await res.json();
  addBubble(data.message, "ai");
  setDisabled(false);
  inputEl.focus();
}

async function sendMessage() {
  const msg = inputEl.value.trim();
  if (!msg) return;
  inputEl.value = "";
  addBubble(msg, "user");
  setDisabled(true);

  const t0 = Date.now();
  const res  = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: msg }),
  });
  const data = await res.json();
  const elapsed = ((Date.now() - t0) / 1000).toFixed(1);

  if (data.debug) addDebug(`⏱ ${elapsed}s\n${data.debug}`);
  addBubble(data.message, "ai");

  if (data.done) {
    if (data.slots) addSlots(data.slots, data.completion);
  } else {
    setDisabled(false);
    inputEl.focus();
  }
}

inputEl.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });

start();
</script>
</body>
</html>
